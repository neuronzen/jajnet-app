name: Build JAJ Net APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create fresh Android scaffold
        run: |
          cd /tmp
          flutter create --org com.jajnet --project-name customer --platforms android fresh_app

      - name: DEBUG - show scaffold gradle files
        run: |
          echo "======== files in android/ ========"
          ls -la /tmp/fresh_app/android/
          echo ""
          echo "======== settings.gradle (if exists) ========"
          cat /tmp/fresh_app/android/settings.gradle 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "======== settings.gradle.kts (if exists) ========"
          cat /tmp/fresh_app/android/settings.gradle.kts 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "======== build.gradle (if exists) ========"
          cat /tmp/fresh_app/android/build.gradle 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "======== build.gradle.kts (if exists) ========"
          cat /tmp/fresh_app/android/build.gradle.kts 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "======== gradle-wrapper.properties ========"
          cat /tmp/fresh_app/android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || echo "NOT FOUND"

      - name: Force Kotlin 2.0.21 in scaffold (aggressive)
        run: |
          cd /tmp/fresh_app/android

          # Force Kotlin plugin version in settings.gradle / .kts
          for f in settings.gradle settings.gradle.kts; do
            if [ -f "$f" ]; then
              echo "Patching $f ..."
              # Groovy form
              sed -i -E 's|(org\.jetbrains\.kotlin\.android["'"'"']?\)?\s*version\s*["'"'"'])[0-9.]+(["'"'"'])| \12.0.21\2|g' "$f"
              # Kotlin DSL form: id("org.jetbrains.kotlin.android") version "x.y.z"
              sed -i -E 's|(id\("org\.jetbrains\.kotlin\.android"\)\s*version\s*")[0-9.]+(")|\12.0.21\2|g' "$f"
              # Kotlin DSL form: id("org.jetbrains.kotlin.android") version "x.y.z" apply false
              sed -i -E "s|(id\(\"org\.jetbrains\.kotlin\.android\"\) version \")[0-9.]+(\")|\12.0.21\2|g" "$f"
            fi
          done

          # Force ext.kotlin_version in build.gradle
          for f in build.gradle build.gradle.kts app/build.gradle app/build.gradle.kts; do
            if [ -f "$f" ]; then
              echo "Patching $f (kotlin_version)..."
              sed -i -E 's|(ext\.kotlin_version\s*=\s*["'"'"'])[0-9.]+(["'"'"'])| \12.0.21\2|g' "$f"
              sed -i -E "s|(ext\.kotlin_version\s*=\s*['\"])[0-9.]+(['\"])|\12.0.21\2|g" "$f"
            fi
          done

      - name: DEBUG - show patched files
        run: |
          echo "======== settings.gradle after patch ========"
          cat /tmp/fresh_app/android/settings.gradle 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "======== settings.gradle.kts after patch ========"
          cat /tmp/fresh_app/android/settings.gradle.kts 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "======== build.gradle after patch ========"
          cat /tmp/fresh_app/android/build.gradle 2>/dev/null || echo "NOT FOUND"

      - name: Copy android folder into repo
        run: |
          cp -r /tmp/fresh_app/android $GITHUB_WORKSPACE/android

      - name: Place google-services.json
        run: |
          cp google-services.json android/app/google-services.json

      - name: Patch settings.gradle for google-services plugin
        run: |
          for f in android/settings.gradle android/settings.gradle.kts; do
            if [ -f "$f" ]; then
              awk '
                /dev.flutter.flutter-plugin-loader/ {
                  print;
                  print "    id \"com.google.gms.google-services\" version \"4.4.0\" apply false";
                  next
                }
                { print }
              ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            fi
          done
          echo "=== After google-services patch ==="
          cat android/settings.gradle* 2>/dev/null

      - name: Patch app build.gradle for google-services apply
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              if [[ "$f" == *.kts ]]; then
                printf '\nplugins { id("com.google.gms.google-services") }\n' >> "$f"
              else
                printf '\napply plugin: "com.google.gms.google-services"\n' >> "$f"
              fi
            fi
          done

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jajnet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
