name: Build JAJ Net APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create fresh Android scaffold
        run: |
          cd /tmp
          flutter create --org com.jajnet --project-name customer --platforms android fresh_app

      - name: Upgrade Kotlin version in scaffold
        run: |
          FILE=/tmp/fresh_app/android/settings.gradle
          if [ -f /tmp/fresh_app/android/settings.gradle.kts ]; then FILE=/tmp/fresh_app/android/settings.gradle.kts; fi
          echo "=== BEFORE ==="
          cat $FILE
          sed -i 's/version "1\.7\.1"/version "1.9.24"/g' $FILE
          sed -i "s/version '1\.7\.1'/version '1.9.24'/g" $FILE
          sed -i 's/version "1\.8\.22"/version "1.9.24"/g' $FILE
          echo "=== AFTER ==="
          cat $FILE

      - name: Copy android folder into repo
        run: |
          cp -r /tmp/fresh_app/android $GITHUB_WORKSPACE/android

      - name: Place google-services.json
        run: |
          cp google-services.json android/app/google-services.json

      - name: Patch settings.gradle for google-services plugin
        run: |
          FILE=android/settings.gradle
          if [ -f android/settings.gradle.kts ]; then FILE=android/settings.gradle.kts; fi
          awk '
            /dev.flutter.flutter-plugin-loader/ {
              print;
              print "    id \"com.google.gms.google-services\" version \"4.4.0\" apply false";
              next
            }
            { print }
          ' $FILE > $FILE.tmp && mv $FILE.tmp $FILE

      - name: Patch app build.gradle
        run: |
          FILE=android/app/build.gradle
          if [ -f android/app/build.gradle.kts ]; then FILE=android/app/build.gradle.kts; fi
          if [[ "$FILE" == *.kts ]]; then
            printf '\nplugins { id("com.google.gms.google-services") }\n' >> $FILE
          else
            printf '\napply plugin: "com.google.gms.google-services"\n' >> $FILE
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jajnet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
