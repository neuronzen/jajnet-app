name: Add Notice Detail Screen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write lib/notice_detail.dart
        run: |
          cat > lib/notice_detail.dart << 'ENDND'
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';

          import 'theme.dart';

          class NoticeDetailScreen extends StatelessWidget {
            final String title;
            final String body;
            const NoticeDetailScreen({
              super.key,
              required this.title,
              required this.body,
            });

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: JC.white,
                appBar: AppBar(
                  title: Text(
                    'নোটিশ',
                    style: GoogleFonts.hindSiliguri(
                      fontSize: 18,
                      fontWeight: FontWeight.w600,
                      color: JC.ink,
                    ),
                  ),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Container(
                        width: 64,
                        height: 64,
                        decoration: BoxDecoration(
                          gradient: JC.heroGradient,
                          borderRadius: BorderRadius.circular(20),
                          boxShadow: [
                            BoxShadow(
                              color: JC.primary.withOpacity(0.35),
                              blurRadius: 22,
                              offset: const Offset(0, 10),
                            ),
                          ],
                        ),
                        child: const Icon(
                          Icons.campaign_rounded,
                          color: Colors.white,
                          size: 32,
                        ),
                      ),
                      const SizedBox(height: 24),
                      Text(
                        title,
                        style: GoogleFonts.hindSiliguri(
                          fontSize: 22,
                          fontWeight: FontWeight.w700,
                          color: JC.ink,
                          height: 1.35,
                        ),
                      ),
                      const SizedBox(height: 10),
                      Container(
                        width: 44,
                        height: 3,
                        decoration: BoxDecoration(
                          color: JC.primary,
                          borderRadius: BorderRadius.circular(2),
                        ),
                      ),
                      const SizedBox(height: 22),
                      Container(
                        padding: const EdgeInsets.all(20),
                        decoration: BoxDecoration(
                          color: JC.cream,
                          borderRadius: BorderRadius.circular(18),
                        ),
                        child: Text(
                          body.isEmpty ? 'বিস্তারিত তথ্য নেই' : body,
                          style: GoogleFonts.hindSiliguri(
                            fontSize: 15,
                            color: JC.inkSoft,
                            height: 1.75,
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          ENDND
          sed -i 's/^          //' lib/notice_detail.dart

      - name: Patch screens.dart
        run: |
          python3 << 'ENDPY'
          import re
          with open('lib/screens.dart') as f:
              c = f.read()
          if 'notice_detail.dart' not in c:
              c = c.replace(
                  "import 'services.dart';",
                  "import 'services.dart';\nimport 'notice_detail.dart';",
              )
              print("Imported notice_detail.dart")
          pattern = re.compile(
              r"return Container\(\s*margin: const EdgeInsets\.only\(bottom: 10\),\s*padding: const EdgeInsets\.all\(14\),\s*decoration: BoxDecoration\(\s*color: JajColors\.surfaceLight,\s*borderRadius: BorderRadius\.circular\(16\),\s*\),\s*child: Row\(\s*children: \[\s*const Icon\(Icons\.campaign_outlined,\s*color: JajColors\.primary\),\s*const SizedBox\(width: 12\),\s*Expanded\(\s*child: Text\(m\['title'\] \?\? '',\s*style: const TextStyle\(\s*fontWeight: FontWeight\.w500\)\),\s*\),\s*\],\s*\),\s*\);",
              re.DOTALL,
          )
          repl = """return GestureDetector(
                        onTap: () => Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (_) => NoticeDetailScreen(
                              title: m['title'] ?? '',
                              body: m['body'] ?? '',
                            ),
                          ),
                        ),
                        child: Container(
                          margin: const EdgeInsets.only(bottom: 10),
                          padding: const EdgeInsets.all(14),
                          decoration: BoxDecoration(
                            color: JajColors.surfaceLight,
                            borderRadius: BorderRadius.circular(16),
                          ),
                          child: Row(
                            children: [
                              const Icon(Icons.campaign_outlined,
                                  color: JajColors.primary),
                              const SizedBox(width: 12),
                              Expanded(
                                child: Text(m['title'] ?? '',
                                    style: const TextStyle(
                                        fontWeight: FontWeight.w500)),
                              ),
                              const Icon(Icons.chevron_right,
                                  color: JajColors.textLight, size: 20),
                            ],
                          ),
                        ),
                      );"""
          c, n = pattern.subn(repl, c)
          print(f"Replacements: {n}")
          with open('lib/screens.dart', 'w') as f:
              f.write(c)
          ENDPY

      - name: Commit and push
        run: |
          git config user.name "JAJ Net Bot"
          git config user.email "bot@jajnet.local"
          git add .
          git commit -m "Add notice detail screen" || echo "nothing to commit"
          git push
