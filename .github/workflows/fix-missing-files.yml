name: Fix Missing Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write lib/notice_detail.dart
        run: |
          cat > lib/notice_detail.dart << 'ENDND'
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';

          import 'theme.dart';

          class NoticeDetailScreen extends StatelessWidget {
            final String title;
            final String body;
            const NoticeDetailScreen({
              super.key,
              required this.title,
              required this.body,
            });

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: JC.white,
                appBar: AppBar(
                  title: Text(
                    'নোটিশ',
                    style: GoogleFonts.hindSiliguri(
                      fontSize: 18,
                      fontWeight: FontWeight.w600,
                      color: JC.ink,
                      height: 1.4,
                    ),
                  ),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(24),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Container(
                        width: 64,
                        height: 64,
                        decoration: BoxDecoration(
                          gradient: JC.heroGradient,
                          borderRadius: BorderRadius.circular(20),
                          boxShadow: [
                            BoxShadow(
                              color: JC.primary.withOpacity(0.35),
                              blurRadius: 22,
                              offset: const Offset(0, 10),
                            ),
                          ],
                        ),
                        child: const Icon(
                          Icons.campaign_rounded,
                          color: Colors.white,
                          size: 32,
                        ),
                      ),
                      const SizedBox(height: 24),
                      Text(
                        title,
                        style: GoogleFonts.hindSiliguri(
                          fontSize: 22,
                          fontWeight: FontWeight.w700,
                          color: JC.ink,
                          height: 1.5,
                        ),
                      ),
                      const SizedBox(height: 12),
                      Container(
                        width: 44,
                        height: 3,
                        decoration: BoxDecoration(
                          color: JC.primary,
                          borderRadius: BorderRadius.circular(2),
                        ),
                      ),
                      const SizedBox(height: 22),
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.all(20),
                        decoration: BoxDecoration(
                          color: JC.cream,
                          borderRadius: BorderRadius.circular(18),
                        ),
                        child: Text(
                          body.isEmpty ? 'বিস্তারিত তথ্য নেই' : body,
                          style: GoogleFonts.hindSiliguri(
                            fontSize: 15,
                            color: JC.inkSoft,
                            height: 1.9,
                          ),
                        ),
                      ),
                      const SizedBox(height: 30),
                    ],
                  ),
                ),
              );
            }
          }
          ENDND
          sed -i 's/^          //' lib/notice_detail.dart

      - name: Ensure google_fonts import in screens.dart
        run: |
          python3 << 'ENDPY'
          with open('lib/screens.dart') as f:
              c = f.read()

          # Check if google_fonts is imported
          if "package:google_fonts/google_fonts.dart" not in c:
              # Add at the very top
              c = "import 'package:google_fonts/google_fonts.dart';\n" + c
              print("google_fonts import added at top")
          else:
              print("google_fonts already imported")

          # Also ensure notice_detail import if not present
          if "import 'notice_detail.dart';" not in c:
              if "import 'dashboard_v2.dart';" in c:
                  c = c.replace(
                      "import 'dashboard_v2.dart';",
                      "import 'dashboard_v2.dart';\nimport 'notice_detail.dart';",
                      1
                  )
                  print("notice_detail import added")
              elif "import 'services.dart';" in c:
                  c = c.replace(
                      "import 'services.dart';",
                      "import 'services.dart';\nimport 'notice_detail.dart';",
                      1
                  )
                  print("notice_detail import added after services")

          with open('lib/screens.dart', 'w') as f:
              f.write(c)
          ENDPY

      - name: Verify
        run: |
          echo "=== notice_detail.dart exists? ==="
          ls -la lib/notice_detail.dart
          echo "=== screens.dart imports ==="
          head -12 lib/screens.dart
          echo "=== GoogleFonts usage ==="
          grep -c "GoogleFonts" lib/screens.dart || true
          echo "=== NoticeDetailScreen references ==="
          grep -c "NoticeDetailScreen" lib/screens.dart lib/dashboard_v2.dart || true

      - name: Commit
        run: |
          git config user.name "JAJ Net Bot"
          git config user.email "bot@jajnet.local"
          git add lib/
          git commit -m "Add notice_detail.dart and google_fonts import" || echo "no change"
          git push
