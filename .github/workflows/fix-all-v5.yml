      - name: Patch screens.dart
        run: |
          python3 << 'ENDPY'
          import re
          with open('lib/screens.dart') as f:
              c = f.read()

          # Rename old PaymentScreen class to _OldPaymentScreen
          c = c.replace(
              "class PaymentScreen extends StatefulWidget {",
              "class _OldPaymentScreen extends StatefulWidget {",
          )
          c = c.replace(
              "State<PaymentScreen> createState() => _PaymentScreenState();",
              "State<_OldPaymentScreen> createState() => _OldPaymentScreenState();",
          )
          c = c.replace(
              "class _PaymentScreenState extends State<PaymentScreen> {",
              "class _OldPaymentScreenState extends State<_OldPaymentScreen> {",
          )
          print("Old PaymentScreen renamed")

          # Add import for payment_screen.dart
          if "import 'payment_screen.dart';" not in c:
              if "import 'dashboard_v2.dart';" in c:
                  c = c.replace(
                      "import 'dashboard_v2.dart';",
                      "import 'dashboard_v2.dart';\nimport 'payment_screen.dart';",
                      1,
                  )
                  print("payment_screen import added")
              elif "import 'services.dart';" in c:
                  c = c.replace(
                      "import 'services.dart';",
                      "import 'services.dart';\nimport 'payment_screen.dart';",
                      1,
                  )
                  print("payment_screen import added after services")

          # Fix logout button height + login screen ref
          # Replace "const LoginScreen()" with "const LoginScreenNew()"
          c = c.replace("const LoginScreen()", "const LoginScreenNew()")

          # Try to increase logout button height
          c = c.replace(
              "SizedBox(\n                height: 52,\n                child: OutlinedButton.icon(",
              "SizedBox(\n                height: 60,\n                child: OutlinedButton.icon(",
          )

          with open('lib/screens.dart', 'w') as f:
              f.write(c)
          print("screens.dart patched")
          ENDPY

      - name: Verify
        run: |
          echo "=== Files ==="
          ls -la lib/*.dart
          echo ""
          echo "=== payment_screen import ==="
          grep -n "payment_screen.dart" lib/screens.dart
          echo ""
          echo "=== _OldPaymentScreen renamed ==="
          grep -c "_OldPaymentScreen" lib/screens.dart
          echo ""
          echo "=== LoginScreenNew usage in screens ==="
          grep -c "LoginScreenNew" lib/screens.dart
          echo ""
          echo "=== logout height ==="
          grep -n "height: 60" lib/screens.dart | head -2

