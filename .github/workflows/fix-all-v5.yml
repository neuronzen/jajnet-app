name: Fix All v5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write lib/payment_screen.dart
        run: |
          cat > lib/payment_screen.dart << 'ENDPS'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:intl/intl.dart';

          import 'services.dart';
          import 'theme.dart';

          class PaymentScreen extends StatefulWidget {
            const PaymentScreen({super.key});
            @override
            State<PaymentScreen> createState() => _PaymentScreenState();
          }

          class _PaymentScreenState extends State<PaymentScreen> {
            final _trx = TextEditingController();
            int _months = 1;
            int _packagePrice = 500;
            int _currentDue = 0;
            String _packageName = '20 Mbps';
            bool _loading = false;
            bool _fetching = true;

            static const List<int> _monthOptions = [1, 2, 3, 6, 12];

            @override
            void initState() {
              super.initState();
              _loadUser();
            }

            @override
            void dispose() {
              _trx.dispose();
              super.dispose();
            }

            Future<void> _loadUser() async {
              final u = AuthService.currentUser;
              if (u == null) return;
              try {
                final doc = await FirebaseFirestore.instance
                    .collection('users')
                    .doc(u.uid)
                    .get();
                final d = doc.data() ?? {};
                if (!mounted) return;
                setState(() {
                  _packagePrice = _toInt(d['packagePrice'], 500);
                  _currentDue = _toInt(d['dueAmount'], 0);
                  _packageName = (d['package'] ?? '20 Mbps').toString();
                  _fetching = false;
                });
              } catch (e) {
                debugPrint('load user error: $e');
                if (mounted) setState(() => _fetching = false);
              }
            }

            int _toInt(dynamic v, int fallback) {
              if (v == null) return fallback;
              if (v is int) return v;
              if (v is num) return v.toInt();
              return int.tryParse(v.toString()) ?? fallback;
            }

            int get _totalAmount => _months * _packagePrice;

            Future<void> _copyNumber() async {
              await Clipboard.setData(
                  const ClipboardData(text: AppInfo.bkashNumber));
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Row(
                    children: [
                      const Icon(Icons.check_circle_rounded,
                          color: Colors.white, size: 20),
                      const SizedBox(width: 8),
                      Expanded(
                        child: Text(
                          'নাম্বার কপি হয়েছে: ${AppInfo.bkashNumber}',
                          style: GoogleFonts.hindSiliguri(height: 1.5),
                        ),
                      ),
                    ],
                  ),
                  backgroundColor: JC.success,
                  behavior: SnackBarBehavior.floating,
                  duration: const Duration(seconds: 3),
                ),
              );
            }

            Future<void> _submit() async {
              if (_trx.text.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text('TrxID দিন',
                        style: GoogleFonts.hindSiliguri(height: 1.5)),
                  ),
                );
                return;
              }
              setState(() => _loading = true);
              try {
                await AuthService.submitPayment(
                  trxId: _trx.text.trim(),
                  amount: _totalAmount,
                  method: 'bKash',
                );
                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(
                      'পেমেন্ট জমা হয়েছে। যাচাই হলে অ্যাপে দেখতে পাবেন।',
                      style: GoogleFonts.hindSiliguri(height: 1.5),
                    ),
                    backgroundColor: JC.success,
                    behavior: SnackBarBehavior.floating,
                  ),
                );
                _trx.clear();
              } catch (e) {
                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text('সমস্যা: $e',
                        style: GoogleFonts.hindSiliguri(height: 1.5)),
                  ),
                );
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              if (_fetching) {
                return const Scaffold(
                  body:
                      Center(child: CircularProgressIndicator(color: JC.primary)),
                );
              }
              return Scaffold(
                backgroundColor: JC.white,
                appBar: AppBar(
                  title: Text(
                    'বিল পরিশোধ',
                    style: GoogleFonts.hindSiliguri(
                      fontSize: 18,
                      fontWeight: FontWeight.w600,
                      color: JC.ink,
                      height: 1.5,
                    ),
                  ),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      _bkashCard(),
                      const SizedBox(height: 24),
                      _sectionTitle('পেমেন্ট তথ্য'),
                      const SizedBox(height: 10),
                      _infoRow('মাসিক বিল', '৳$_packagePrice'),
                      _infoRow('প্যাকেজ', _packageName),
                      if (_currentDue > 0)
                        _infoRow('বর্তমান বকেয়া', '৳$_currentDue',
                            highlight: true),
                      const SizedBox(height: 22),
                      _sectionTitle('কত মাসের বিল দিচ্ছেন?'),
                      const SizedBox(height: 10),
                      _monthChips(),
                      const SizedBox(height: 20),
                      _amountCard(),
                      const SizedBox(height: 20),
                      _trxField(),
                      const SizedBox(height: 20),
                      _submitButton(),
                      const SizedBox(height: 30),
                    ],
                  ),
                ),
              );
            }

            Widget _sectionTitle(String s) => Text(
                  s,
                  style: GoogleFonts.hindSiliguri(
                    fontSize: 15,
                    fontWeight: FontWeight.w700,
                    color: JC.ink,
                    height: 1.5,
                  ),
                );

            Widget _bkashCard() {
              return Container(
                padding: const EdgeInsets.all(20),
                decoration: BoxDecoration(
                  gradient: JC.heroGradient,
                  borderRadius: BorderRadius.circular(20),
                  boxShadow: [
                    BoxShadow(
                      color: JC.primary.withOpacity(0.3),
                      blurRadius: 20,
                      offset: const Offset(0, 10),
                    ),
                  ],
                ),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(
                      children: [
                        Container(
                          padding: const EdgeInsets.symmetric(
                              horizontal: 10, vertical: 5),
                          decoration: BoxDecoration(
                            color: Colors.white.withOpacity(0.25),
                            borderRadius: BorderRadius.circular(8),
                          ),
                          child: Text(
                            'bKash',
                            style: GoogleFonts.poppins(
                              fontSize: 12,
                              fontWeight: FontWeight.w700,
                              color: Colors.white,
                              height: 1.5,
                            ),
                          ),
                        ),
                        const SizedBox(width: 8),
                        Text(
                          'Send Money',
                          style: GoogleFonts.hindSiliguri(
                            fontSize: 12,
                            color: Colors.white.withOpacity(0.9),
                            height: 1.5,
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 12),
                    Text(
                      AppInfo.bkashNumber,
                      style: GoogleFonts.poppins(
                        fontSize: 26,
                        fontWeight: FontWeight.w700,
                        color: Colors.white,
                        height: 1.4,
                      ),
                    ),
                    const SizedBox(height: 8),
                    Text(
                      'উপরের নাম্বারে Send Money করুন, তারপর TrxID নিচে লিখে সাবমিট করুন',
                      style: GoogleFonts.hindSiliguri(
                        fontSize: 12.5,
                        color: Colors.white.withOpacity(0.9),
                        height: 1.6,
                      ),
                    ),
                    const SizedBox(height: 16),
                    GestureDetector(
                      onTap: _copyNumber,
                      child: Container(
                        padding: const EdgeInsets.symmetric(
                            vertical: 14, horizontal: 16),
                        decoration: BoxDecoration(
                          color: Colors.white,
                          borderRadius: BorderRadius.circular(12),
                        ),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            const Icon(Icons.copy_rounded,
                                color: JC.primary, size: 18),
                            const SizedBox(width: 8),
                            Text(
                              'নাম্বার কপি করুন',
                              style: GoogleFonts.hindSiliguri(
                                fontSize: 14,
                                fontWeight: FontWeight.w700,
                                color: JC.primary,
                                height: 1.5,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _infoRow(String label, String value,
                {bool highlight = false}) {
              return Padding(
                padding: const EdgeInsets.symmetric(vertical: 8),
                child: Row(
                  children: [
                    Text(
                      label,
                      style: GoogleFonts.hindSiliguri(
                        fontSize: 14,
                        color: JC.grey,
                        height: 1.5,
                      ),
                    ),
                    const Spacer(),
                    Text(
                      value,
                      style: GoogleFonts.poppins(
                        fontSize: 15,
                        fontWeight: FontWeight.w700,
                        color: highlight ? JC.error : JC.ink,
                        height: 1.5,
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _monthChips() {
              return Wrap(
                spacing: 8,
                runSpacing: 8,
                children: _monthOptions.map((m) {
                  final active = _months == m;
                  final label = m == 12 ? '১ বছর' : '$m মাস';
                  return GestureDetector(
                    onTap: () => setState(() => _months = m),
                    child: Container(
                      padding: const EdgeInsets.symmetric(
                          horizontal: 20, vertical: 12),
                      decoration: BoxDecoration(
                        color: active ? JC.primary : JC.cream,
                        borderRadius: BorderRadius.circular(14),
                        border: Border.all(
                          color: active ? JC.primary : JC.creamDeep,
                          width: 1.5,
                        ),
                      ),
                      child: Text(
                        label,
                        style: GoogleFonts.hindSiliguri(
                          fontSize: 14,
                          fontWeight: FontWeight.w700,
                          color: active ? Colors.white : JC.ink,
                          height: 1.5,
                        ),
                      ),
                    ),
                  );
                }).toList(),
              );
            }

            Widget _amountCard() {
              return Container(
                padding: const EdgeInsets.all(18),
                decoration: BoxDecoration(
                  color: JC.cream,
                  borderRadius: BorderRadius.circular(16),
                  border: Border.all(color: JC.creamDeep, width: 1.5),
                ),
                child: Row(
                  children: [
                    Container(
                      width: 44,
                      height: 44,
                      decoration: BoxDecoration(
                        color: JC.primary.withOpacity(0.12),
                        borderRadius: BorderRadius.circular(12),
                      ),
                      child: const Icon(Icons.attach_money_rounded,
                          color: JC.primary, size: 22),
                    ),
                    const SizedBox(width: 14),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            'মোট পরিশোধ',
                            style: GoogleFonts.hindSiliguri(
                              fontSize: 12,
                              color: JC.grey,
                              height: 1.5,
                            ),
                          ),
                          Text(
                            '৳ ${NumberFormat('#,##0').format(_totalAmount)}',
                            style: GoogleFonts.poppins(
                              fontSize: 24,
                              fontWeight: FontWeight.w700,
                              color: JC.primary,
                              height: 1.5,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _trxField() {
              return TextField(
                controller: _trx,
                style: GoogleFonts.poppins(
                    fontSize: 14, color: JC.ink, height: 1.5),
                decoration: InputDecoration(
                  labelText: 'TrxID',
                  hintText: 'যেমন: 9AB12CD34E',
                  prefixIcon: const Icon(
                      Icons.confirmation_number_outlined,
                      color: JC.primary,
                      size: 20),
                  labelStyle:
                      GoogleFonts.hindSiliguri(fontSize: 14, color: JC.grey),
                  hintStyle:
                      GoogleFonts.hindSiliguri(fontSize: 13, color: JC.grey),
                  floatingLabelStyle: GoogleFonts.hindSiliguri(
                    color: JC.primary,
                    fontWeight: FontWeight.w500,
                  ),
                  filled: true,
                  fillColor: JC.cream,
                  border: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(16),
                    borderSide: BorderSide.none,
                  ),
                  enabledBorder: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(16),
                    borderSide: BorderSide.none,
                  ),
                  focusedBorder: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(16),
                    borderSide: const BorderSide(color: JC.primary, width: 1.5),
                  ),
                  contentPadding: const EdgeInsets.symmetric(
                      vertical: 18, horizontal: 16),
                ),
              );
            }

            Widget _submitButton() {
              return GestureDetector(
                onTap: _loading ? null : _submit,
                child: Container(
                  height: 58,
                  decoration: BoxDecoration(
                    gradient: JC.heroGradient,
                    borderRadius: BorderRadius.circular(18),
                    boxShadow: [
                      BoxShadow(
                        color: JC.primary.withOpacity(0.35),
                        blurRadius: 20,
                        offset: const Offset(0, 10),
                      ),
                    ],
                  ),
                  child: Center(
                    child: _loading
                        ? const SizedBox(
                            width: 22,
                            height: 22,
                            child: CircularProgressIndicator(
                                color: Colors.white, strokeWidth: 2.5),
                          )
                        : Text(
                            'সাবমিট করুন',
                            style: GoogleFonts.hindSiliguri(
                              fontSize: 16,
                              fontWeight: FontWeight.w700,
                              color: Colors.white,
                              height: 1.5,
                            ),
                          ),
                  ),
                ),
              );
            }
          }
          ENDPS
          sed -i 's/^          //' lib/payment_screen.dart

      - name: Rewrite lib/dashboard_v2.dart
        run: |
          cat > lib/dashboard_v2.dart << 'ENDDASH'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:intl/intl.dart';

          import 'notice_detail.dart';
          import 'payment_screen.dart';
          import 'screens.dart';
          import 'services.dart';
          import 'theme.dart';

          class DashboardHome extends StatefulWidget {
            const DashboardHome({super.key});
            @override
            State<DashboardHome> createState() => _DashboardHomeState();
          }

          class _DashboardHomeState extends State<DashboardHome> {
            Map<String, dynamic>? _user;
            List<Map<String, dynamic>> _payments = [];
            List<Map<String, dynamic>> _notices = [];
            bool _loading = true;

            @override
            void initState() {
              super.initState();
              _load();
            }

            Future<void> _load() async {
              final u = AuthService.currentUser;
              if (u == null) return;
              try {
                final results = await Future.wait([
                  FirebaseFirestore.instance
                      .collection('users')
                      .doc(u.uid)
                      .get(),
                  FirebaseFirestore.instance
                      .collection('payments')
                      .where('userId', isEqualTo: u.uid)
                      .get(),
                  FirebaseFirestore.instance
                      .collection('notices')
                      .limit(5)
                      .get(),
                ]);
                final userDoc = results[0] as DocumentSnapshot;
                final paySnap = results[1] as QuerySnapshot;
                final noticeSnap = results[2] as QuerySnapshot;

                final pays = paySnap.docs.map((d) {
                  final m = d.data() as Map<String, dynamic>;
                  return <String, dynamic>{'id': d.id, ...m};
                }).toList();
                pays.sort((a, b) {
                  final at = a['createdAt'] as Timestamp?;
                  final bt = b['createdAt'] as Timestamp?;
                  if (at == null || bt == null) return 0;
                  return bt.compareTo(at);
                });

                final nots = noticeSnap.docs.map((d) {
                  final m = d.data() as Map<String, dynamic>;
                  return <String, dynamic>{'id': d.id, ...m};
                }).toList();

                if (!mounted) return;
                setState(() {
                  _user = userDoc.data() as Map<String, dynamic>?;
                  _payments = pays;
                  _notices = nots.take(3).toList();
                  _loading = false;
                });
              } catch (e) {
                debugPrint('Dashboard error: $e');
                if (mounted) setState(() => _loading = false);
              }
            }

            Future<void> _refresh() async {
              await _load();
            }

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: _loading
                    ? const Center(
                        child:
                            CircularProgressIndicator(color: JC.primary))
                    : RefreshIndicator(
                        onRefresh: _refresh,
                        color: JC.primary,
                        child: ListView(
                          physics: const AlwaysScrollableScrollPhysics(),
                          padding:
                              const EdgeInsets.fromLTRB(20, 12, 20, 30),
                          children: [
                            _header(),
                            const SizedBox(height: 20),
                            _balanceCard(),
                            const SizedBox(height: 24),
                            _sectionTitle('দ্রুত কাজ'),
                            const SizedBox(height: 12),
                            _quickActions(context),
                            if (_payments.isNotEmpty) ...[
                              const SizedBox(height: 24),
                              _sectionTitle('সাম্প্রতিক পেমেন্ট'),
                              const SizedBox(height: 12),
                              _paymentsCard(),
                            ],
                            if (_notices.isNotEmpty) ...[
                              const SizedBox(height: 24),
                              _sectionTitle('নোটিশ বোর্ড'),
                              const SizedBox(height: 12),
                              _noticesCard(context),
                            ],
                            const SizedBox(height: 20),
                          ],
                        ),
                      ),
              );
            }

            Widget _header() {
              final name = (_user?['name'] ?? 'গ্রাহক').toString();
              return Row(
                children: [
                  Expanded(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          'স্বাগতম, $name 👋',
                          style: GoogleFonts.hindSiliguri(
                            fontSize: 22,
                            fontWeight: FontWeight.w700,
                            color: JC.ink,
                            height: 1.5,
                          ),
                        ),
                        const SizedBox(height: 2),
                        Text(
                          'আপনার JAJ Net অ্যাকাউন্ট',
                          style: GoogleFonts.hindSiliguri(
                            fontSize: 13,
                            color: JC.grey,
                            height: 1.5,
                          ),
                        ),
                      ],
                    ),
                  ),
                  Container(
                    width: 46,
                    height: 46,
                    decoration: BoxDecoration(
                      gradient: JC.heroGradient,
                      borderRadius: BorderRadius.circular(14),
                      boxShadow: [
                        BoxShadow(
                          color: JC.primary.withOpacity(0.3),
                          blurRadius: 14,
                          offset: const Offset(0, 6),
                        ),
                      ],
                    ),
                    child: const Icon(Icons.wifi_rounded,
                        color: Colors.white, size: 24),
                  ),
                ],
              );
            }

            Widget _balanceCard() {
              final due = (_user?['dueAmount'] ?? 0) as num;
              final pkg = (_user?['package'] ?? '20 Mbps').toString();
              final status = (_user?['status'] ?? 'active').toString();
              final createdAt = _user?['createdAt'] as Timestamp?;

              int daysUsed = 0;
              int daysLeft = 30;
              if (createdAt != null) {
                final diff =
                    DateTime.now().difference(createdAt.toDate()).inDays;
                daysUsed = diff.clamp(0, 30);
                daysLeft = (30 - diff).clamp(0, 30);
              }
              final progress = daysUsed / 30.0;
              final dueSoon = daysLeft <= 5 && due > 0;

              return Container(
                padding: const EdgeInsets.all(22),
                decoration: BoxDecoration(
                  gradient: JC.heroGradient,
                  borderRadius: BorderRadius.circular(24),
                  boxShadow: [
                    BoxShadow(
                      color: JC.primary.withOpacity(0.35),
                      blurRadius: 26,
                      offset: const Offset(0, 12),
                    ),
                  ],
                ),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(
                      children: [
                        Text(
                          'মোট বকেয়া',
                          style: GoogleFonts.hindSiliguri(
                            color: Colors.white.withOpacity(0.85),
                            fontSize: 13,
                            height: 1.5,
                          ),
                        ),
                        const Spacer(),
                        Container(
                          padding: const EdgeInsets.symmetric(
                              horizontal: 10, vertical: 5),
                          decoration: BoxDecoration(
                            color: Colors.white.withOpacity(0.22),
                            borderRadius: BorderRadius.circular(20),
                          ),
                          child: Text(
                            status.toUpperCase(),
                            style: GoogleFonts.poppins(
                              fontSize: 10,
                              fontWeight: FontWeight.w700,
                              color: Colors.white,
                              letterSpacing: 0.5,
                              height: 1.5,
                            ),
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 6),
                    Text(
                      '৳ ${NumberFormat('#,##0').format(due)}',
                      style: GoogleFonts.poppins(
                        fontSize: 38,
                        fontWeight: FontWeight.w700,
                        color: Colors.white,
                        height: 1.4,
                      ),
                    ),
                    const SizedBox(height: 18),
                    Container(
                      height: 6,
                      decoration: BoxDecoration(
                        color: Colors.white.withOpacity(0.25),
                        borderRadius: BorderRadius.circular(3),
                      ),
                      child: FractionallySizedBox(
                        alignment: Alignment.centerLeft,
                        widthFactor: progress,
                        child: Container(
                          decoration: BoxDecoration(
                            color: Colors.white,
                            borderRadius: BorderRadius.circular(3),
                          ),
                        ),
                      ),
                    ),
                    const SizedBox(height: 10),
                    Row(
                      children: [
                        Icon(
                          dueSoon
                              ? Icons.warning_amber_rounded
                              : Icons.access_time_rounded,
                          color: Colors.white.withOpacity(0.85),
                          size: 15,
                        ),
                        const SizedBox(width: 6),
                        Text(
                          due > 0 ? '$daysLeft দিন বাকি' : 'পরিশোধিত',
                          style: GoogleFonts.hindSiliguri(
                            fontSize: 12.5,
                            color: Colors.white.withOpacity(0.9),
                            fontWeight: FontWeight.w500,
                            height: 1.5,
                          ),
                        ),
                        const Spacer(),
                        Icon(Icons.speed_rounded,
                            color: Colors.white.withOpacity(0.85),
                            size: 15),
                        const SizedBox(width: 6),
                        Text(
                          pkg,
                          style: GoogleFonts.poppins(
                            fontSize: 12.5,
                            color: Colors.white.withOpacity(0.9),
                            fontWeight: FontWeight.w600,
                            height: 1.5,
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 18),
                    GestureDetector(
                      onTap: () => Navigator.push(
                        context,
                        MaterialPageRoute(
                            builder: (_) => const PaymentScreen()),
                      ),
                      child: Container(
                        height: 50,
                        decoration: BoxDecoration(
                          color: Colors.white,
                          borderRadius: BorderRadius.circular(14),
                        ),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            Text(
                              'এখনই পরিশোধ করুন',
                              style: GoogleFonts.hindSiliguri(
                                fontSize: 14,
                                fontWeight: FontWeight.w700,
