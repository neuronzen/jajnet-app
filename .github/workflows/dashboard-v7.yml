name: Dashboard v7 + Packages + Speed Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update pubspec.yaml - add http
        run: |
          python3 << 'ENDPY'
          with open('pubspec.yaml') as f:
              c = f.read()
          if 'http:' not in c.split('dependencies:')[1].split('dev_dependencies:')[0]:
              c = c.replace(
                  "  intl: ^0.19.0",
                  "  intl: ^0.19.0\n  http: ^1.1.2"
              )
              print("Added http")
          with open('pubspec.yaml','w') as f:
              f.write(c)
          ENDPY
          grep -E "http:|intl:|pdf:" pubspec.yaml

      - name: Update packages in services.dart
        run: |
          python3 << 'ENDPY'
          import re
          with open('lib/services.dart') as f:
              c = f.read()

          # Find and replace the packages list
          pattern = r"static const List<Map<String, dynamic>> packages = \[.*?\];"
          new_list = """static const List<Map<String, dynamic>> packages = [
            {'name': 'Starter', 'speed': '20 Mbps', 'price': 525},
            {'name': 'Basic', 'speed': '30 Mbps', 'price': 650},
            {'name': 'Elite', 'speed': '40 Mbps', 'price': 750},
            {'name': 'Premium', 'speed': '50 Mbps', 'price': 850},
          ];"""
          c2 = re.sub(pattern, new_list, c, flags=re.DOTALL)
          if c2 != c:
              c = c2
              print("Packages updated")
          else:
              print("Pattern not found — trying line-based")

          with open('lib/services.dart','w') as f:
              f.write(c)
          ENDPY
          grep -A 6 "static const List<Map<String, dynamic>> packages" lib/services.dart

      - name: Write lib/speed_test.dart
        run: |
          cat > lib/speed_test.dart << 'ENDST'
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:http/http.dart' as http;

          import 'theme.dart';

          class SpeedTestSheet extends StatefulWidget {
            const SpeedTestSheet({super.key});
            @override
            State<SpeedTestSheet> createState() => _SpeedTestSheetState();
          }

          class _SpeedTestSheetState extends State<SpeedTestSheet> {
            bool _running = false;
            double _mbps = 0;
            double _progress = 0;
            String _status = 'শুরু করুন';
            bool _done = false;

            Future<void> _run() async {
              setState(() {
                _running = true;
                _mbps = 0;
                _progress = 0;
                _status = 'ডাউনলোড টেস্ট চলছে...';
                _done = false;
              });

              final uri = Uri.parse(
                  'https://speed.cloudflare.com/__down?bytes=10000000');
              final client = http.Client();
              final sw = Stopwatch()..start();
              int bytes = 0;
              const total = 10000000;

              try {
                final req = http.Request('GET', uri);
                final res = await client.send(req);
                await for (final chunk in res.stream) {
                  bytes += chunk.length;
                  if (mounted) {
                    setState(() {
                      _progress = (bytes / total).clamp(0.0, 1.0);
                    });
                  }
                }
                sw.stop();
                final sec = sw.elapsedMilliseconds / 1000.0;
                final mbps = (bytes * 8) / (sec * 1000000);
                if (!mounted) return;
                setState(() {
                  _mbps = mbps;
                  _status = 'সম্পন্ন';
                  _done = true;
                  _progress = 1;
                });
              } catch (e) {
                if (!mounted) return;
                setState(() {
                  _status = 'টেস্ট ব্যর্থ — ইন্টারনেট চেক করুন';
                  _done = true;
                });
              } finally {
                client.close();
                if (mounted) setState(() => _running = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.fromLTRB(24, 16, 24, 28),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Container(
                      width: 40,
                      height: 4,
                      decoration: BoxDecoration(
                        color: JC.greyLight,
                        borderRadius: BorderRadius.circular(2),
                      ),
                    ),
                    const SizedBox(height: 22),
                    Row(
                      children: [
                        Container(
                          width: 44,
                          height: 44,
                          decoration: BoxDecoration(
                            gradient: JC.heroGradient,
                            borderRadius: BorderRadius.circular(14),
                          ),
                          child: const Icon(Icons.speed_rounded,
                              color: Colors.white, size: 24),
                        ),
                        const SizedBox(width: 12),
                        Text(
                          'স্পিড টেস্ট',
                          style: GoogleFonts.hindSiliguri(
                            fontSize: 20,
                            fontWeight: FontWeight.w700,
                            color: JC.ink,
                            height: 1.5,
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 30),
                    SizedBox(
                      width: 180,
                      height: 180,
                      child: Stack(
                        alignment: Alignment.center,
                        children: [
                          SizedBox(
                            width: 180,
                            height: 180,
                            child: CircularProgressIndicator(
                              value: _running || _done ? _progress : 0,
                              strokeWidth: 10,
                              backgroundColor: JC.cream,
                              valueColor: const AlwaysStoppedAnimation(
                                  JC.primary),
                            ),
                          ),
                          Column(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              Text(
                                _done
                                    ? _mbps.toStringAsFixed(1)
                                    : (_running
                                        ? (_mbps > 0
                                            ? _mbps.toStringAsFixed(1)
                                            : '...')
                                        : '0'),
                                style: GoogleFonts.poppins(
                                  fontSize: 42,
                                  fontWeight: FontWeight.w700,
                                  color: JC.primary,
                                  height: 1.1,
                                ),
                              ),
                              Text(
                                'Mbps',
                                style: GoogleFonts.poppins(
                                  fontSize: 14,
                                  fontWeight: FontWeight.w600,
                                  color: JC.grey,
                                  height: 1.5,
                                ),
                              ),
                            ],
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 20),
                    Text(
                      _status,
                      textAlign: TextAlign.center,
                      style: GoogleFonts.hindSiliguri(
                        fontSize: 14,
                        color: _done && _mbps > 0 ? JC.success : JC.grey,
                        height: 1.6,
                      ),
                    ),
                    const SizedBox(height: 26),
                    SizedBox(
                      width: double.infinity,
                      height: 54,
                      child: ElevatedButton(
                        onPressed: _running ? null : _run,
                        child: _running
                            ? Row(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  const SizedBox(
                                    width: 18,
                                    height: 18,
                                    child: CircularProgressIndicator(
                                        color: Colors.white, strokeWidth: 2),
                                  ),
                                  const SizedBox(width: 10),
                                  Text('চলছে...',
                                      style: GoogleFonts.hindSiliguri(
                                          fontSize: 15,
                                          fontWeight: FontWeight.w600,
                                          color: Colors.white,
                                          height: 1.5)),
                                ],
                              )
                            : Text(_done ? 'আবার টেস্ট করুন' : 'টেস্ট শুরু করুন',
                                style: GoogleFonts.hindSiliguri(
                                    fontSize: 15,
                                    fontWeight: FontWeight.w700,
                                    color: Colors.white,
                                    height: 1.5)),
                      ),
                    ),
                    const SizedBox(height: 12),
                    Text(
                      'Cloudflare সার্ভার থেকে ১০ MB ডাউনলোড করে স্পিড মাপা হয়',
                      textAlign: TextAlign.center,
                      style: GoogleFonts.hindSiliguri(
                        fontSize: 11,
                        color: JC.grey,
                        height: 1.6,
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          ENDST
          sed -i 's/^          //' lib/speed_test.dart

      - name: Rewrite lib/dashboard_v2.dart
        run: |
          cat > lib/dashboard_v2.dart << 'ENDDASH'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:intl/intl.dart';
          import 'package:url_launcher/url_launcher.dart';

          import 'invoice.dart';
          import 'notice_detail.dart';
          import 'payment_screen.dart';
          import 'screens.dart';
          import 'services.dart';
          import 'speed_test.dart';
          import 'theme.dart';

          class DashboardHome extends StatefulWidget {
            const DashboardHome({super.key});
            @override
            State<DashboardHome> createState() => _DashboardHomeState();
          }

          class _DashboardHomeState extends State<DashboardHome> {
            Map<String, dynamic>? _user;
            List<Map<String, dynamic>> _payments = [];
            List<Map<String, dynamic>> _notices = [];
            bool _loading = true;

            static const List<String> _bnMonths = [
              'জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন',
              'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর',
            ];

            @override
            void initState() {
              super.initState();
              _load();
            }

            Future<void> _load() async {
              final u = AuthService.currentUser;
              if (u == null) return;
              try {
                final results = await Future.wait([
                  FirebaseFirestore.instance
                      .collection('users')
                      .doc(u.uid)
                      .get(),
                  FirebaseFirestore.instance
                      .collection('payments')
                      .where('userId', isEqualTo: u.uid)
                      .get(),
                  FirebaseFirestore.instance
                      .collection('notices')
                      .limit(5)
                      .get(),
                ]);
                final userDoc = results[0] as DocumentSnapshot;
                final paySnap = results[1] as QuerySnapshot;
                final noticeSnap = results[2] as QuerySnapshot;

                final pays = paySnap.docs.map((d) {
                  final m = d.data() as Map<String, dynamic>;
                  return <String, dynamic>{'id': d.id, ...m};
                }).toList();
                pays.sort((a, b) {
                  final at = a['createdAt'] as Timestamp?;
                  final bt = b['createdAt'] as Timestamp?;
                  if (at == null || bt == null) return 0;
                  return bt.compareTo(at);
                });

                final nots = noticeSnap.docs.map((d) {
                  final m = d.data() as Map<String, dynamic>;
                  return <String, dynamic>{'id': d.id, ...m};
                }).toList();

                if (!mounted) return;
                setState(() {
                  _user = userDoc.data() as Map<String, dynamic>?;
                  _payments = pays;
                  _notices = nots.take(3).toList();
                  _loading = false;
                });
              } catch (e) {
                debugPrint('Dashboard error: $e');
                if (mounted) setState(() => _loading = false);
              }
            }

            Future<void> _refresh() async => await _load();

            DateTime get _nextBillingDate {
              final createdAt = _user?['createdAt'] as Timestamp?;
              if (createdAt == null) {
                final now = DateTime.now();
                return DateTime(now.year, now.month + 1, 1);
              }
              final start = createdAt.toDate();
              // Try last verified payment
              Timestamp? lastPay;
              for (final p in _payments) {
                if (p['status'] == 'verified' && p['verifiedAt'] is Timestamp) {
                  lastPay = p['verifiedAt'] as Timestamp;
                  break;
                }
              }
              final base = lastPay?.toDate() ?? start;
              return DateTime(base.year, base.month + 1, base.day);
            }

            int get _daysToNextBilling {
              return _nextBillingDate.difference(DateTime.now()).inDays;
            }

            String get _nextBillingLabel {
              final d = _nextBillingDate;
              return '${d.day} ${_bnMonths[d.month - 1]} ${d.year}';
            }

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: _loading
                    ? const Center(
                        child: CircularProgressIndicator(color: JC.primary))
                    : RefreshIndicator(
                        onRefresh: _refresh,
                        color: JC.primary,
                        child: ListView(
                          physics: const AlwaysScrollableScrollPhysics(),
                          padding: const EdgeInsets.fromLTRB(20, 12, 20, 30),
                          children: [
                            _header(),
                            const SizedBox(height: 20),
                            _balanceCard(),
                            const SizedBox(height: 24),
                            _sectionTitle('দ্রুত কাজ'),
                            const SizedBox(height: 12),
                            _quickActions(context),
                            if (_payments.isNotEmpty) ...[
                              const SizedBox(height: 24),
                              _sectionTitle('সাম্প্রতিক পেমেন্ট'),
                              const SizedBox(height: 12),
                              _paymentsCard(context),
                            ],
                            if (_notices.isNotEmpty) ...[
                              const SizedBox(height: 24),
                              _sectionTitle('নোটিশ বোর্ড'),
                              const SizedBox(height: 12),
                              _noticesCard(context),
                            ],
                            const SizedBox(height: 20),
                          ],
                        ),
                      ),
              );
            }

            Widget _header() {
              final name = (_user?['name'] ?? 'গ্রাহক').toString();
              return Row(
                children: [
                  Expanded(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('স্বাগতম, $name 👋',
                            style: GoogleFonts.hindSiliguri(
                                fontSize: 22,
                                fontWeight: FontWeight.w700,
                                color: JC.ink,
                                height: 1.5)),
                        const SizedBox(height: 2),
                        Text('আপনার JAJ Net অ্যাকাউন্ট',
                            style: GoogleFonts.hindSiliguri(
                                fontSize: 13,
                                color: JC.grey,
                                height: 1.5)),
                      ],
                    ),
                  ),
                  Container(
                    width: 46,
                    height: 46,
                    decoration: BoxDecoration(
                      gradient: JC.heroGradient,
                      borderRadius: BorderRadius.circular(14),
                      boxShadow: [
                        BoxShadow(
                          color: JC.primary.withOpacity(0.3),
                          blurRadius: 14,
                          offset: const Offset(0, 6),
                        ),
                      ],
                    ),
                    child: const Icon(Icons.wifi_rounded,
                        color: Colors.white, size: 24),
                  ),
                ],
              );
            }

            Widget _balanceCard() {
              final due = (_user?['dueAmount'] ?? 0) as num;
              final pkg = (_user?['package'] ?? '20 Mbps').toString();
              final status = (_user?['status'] ?? 'active').toString();
              final isPaid = due <= 0;
              final days = _daysToNextBilling;
              final dueSoon = days <= 5 && !isPaid;

              return Container(
                padding: const EdgeInsets.all(22),
                decoration: BoxDecoration(
                  gradient: JC.heroGradient,
                  borderRadius: BorderRadius.circular(24),
                  boxShadow: [
                    BoxShadow(
                      color: JC.primary.withOpacity(0.35),
                      blurRadius: 26,
                      offset: const Offset(0, 12),
                    ),
                  ],
                ),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    // Connection + Package row
                    Row(
                      children: [
                        _statusChip(status),
                        const Spacer(),
                        Container(
                          padding: const EdgeInsets.symmetric(
                              horizontal: 10, vertical: 5),
                          decoration: BoxDecoration(
                            color: Colors.white.withOpacity(0.22),
                            borderRadius: BorderRadius.circular(20),
                          ),
                          child: Row(
                            children: [
                              const Icon(Icons.speed_rounded,
                                  color: Colors.white, size: 13),
                              const SizedBox(width: 5),
                              Text(
                                pkg,
                                style: GoogleFonts.poppins(
                                  fontSize: 11,
                                  fontWeight: FontWeight.w600,
                                  color: Colors.white,
                                  height: 1.5,
                                ),
                              ),
                            ],
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 18),
                    Text('মোট বকেয়া',
                        style: GoogleFonts.hindSiliguri(
                            color: Colors.white.withOpacity(0.85),
                            fontSize: 13,
                            height: 1.5)),
                    const SizedBox(height: 4),
                    Text(
                      '৳ ${NumberFormat('#,##0').format(due)}',
                      style: GoogleFonts.poppins(
                          fontSize: 40,
                          fontWeight: FontWeight.w700,
                          color: Colors.white,
                          height: 1.3),
                    ),
                    const SizedBox(height: 4),
                    Text(
                      isPaid ? 'বিল স্ট্যাটাস: পরিশোধিত' : 'বিল স্ট্যাটাস: বাকি',
                      style: GoogleFonts.hindSiliguri(
                          fontSize: 13,
                          color: Colors.white.withOpacity(0.92),
                          fontWeight: FontWeight.w500,
                          height: 1.5),
                    ),
                    const SizedBox(height: 16),
                    Container(
                      padding: const EdgeInsets.all(12),
                      decoration: BoxDecoration(
                        color: Colors.white.withOpacity(0.18),
                        borderRadius: BorderRadius.circular(12),
                      ),
                      child: Row(
                        children: [
                          Icon(
                            dueSoon
                                ? Icons.warning_amber_rounded
                                : Icons.calendar_month_rounded,
                            color: Colors.white,
                            size: 18,
                          ),
                          const SizedBox(width: 10),
                          Expanded(
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text('পরবর্তী বিল',
                                    style: GoogleFonts.hindSiliguri(
                                        fontSize: 11,
                                        color: Colors.white.withOpacity(0.85),
                                        height: 1.5)),
                                Text(
                                  _nextBillingLabel,
                                  style: GoogleFonts.hindSiliguri(
                                      fontSize: 14,
                                      fontWeight: FontWeight.w700,
                                      color: Colors.white,
                                      height: 1.5),
                                ),
                              ],
                            ),
                          ),
                          if (!isPaid)
                            Text(
                              '$days দিন',
                              style: GoogleFonts.poppins(
                                  fontSize: 13,
                                  fontWeight: FontWeight.w700,
                                  color: Colors.white,
                                  height: 1.5),
                            ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 16),
                    GestureDetector(
                      onTap: () => Navigator.push(
                          context,
                          MaterialPageRoute(
                              builder: (_) => const PaymentScreen())),
                      child: Container(
                        height: 50,
                        decoration: BoxDecoration(
                          color: Colors.white,
                          borderRadius: BorderRadius.circular(14),
                        ),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            Text('এখনই পরিশোধ করুন',
                                style: GoogleFonts.hindSiliguri(
                                    fontSize: 14,
                                    fontWeight: FontWeight.w700,
                                    color: JC.primary,
                                    height: 1.5)),
                            const SizedBox(width: 6),
                            const Icon(Icons.arrow_forward_rounded,
                                color: JC.primary, size: 18),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _statusChip(String status) {
              final isActive = status.toLowerCase() == 'active';
              final color = isActive ? const Color(0xFF10B981) : JC.warning;
              return Container(
                padding:
                    const EdgeInsets.symmetric(horizontal: 10, vertical: 5),
                decoration: BoxDecoration(
                  color: Colors.white,
                  borderRadius: BorderRadius.circular(20),
                ),
                child: Row(
                  children: [
                    Container(
                      width: 8,
                      height: 8,
                      decoration: BoxDecoration(
                        color: color,
                        shape: BoxShape.circle,
                      ),
                    ),
                    const SizedBox(width: 6),
                    Text(
                      isActive ? 'সংযোগ: সক্রিয়' : 'সংযোগ: ${status.toUpperCase()}',
                      style: GoogleFonts.hindSiliguri(
                          fontSize: 11,
                          fontWeight: FontWeight.w700,
                          color: JC.ink,
                          height: 1.5),
                    ),
                  ],
                ),
              );
            }

            Widget _sectionTitle(String s) => Text(s,
                style: GoogleFonts.hindSiliguri(
                    fontSize: 16,
                    fontWeight: FontWeight.w700,
                    color: JC.ink,
                    height: 1.5));

            Widget _quickActions(BuildContext context) {
              final items = [
                _QA('বিল দিন', Icons.payments_rounded,
                    page: const PaymentScreen()),
                _QA('প্যাকেজ', Icons.wifi_rounded,
                    page: const PackagesScreen()),
                _QA('ইনভয়েস', Icons.receipt_long_rounded,
                    onTap: () => _showInvoiceSheet(context)),
                _QA('স্পিড টেস্ট', Icons.speed_rounded,
                    onTap: () => _showSpeedTest(context)),
              ];
              return Row(
                children: items
                    .map((it) => Expanded(
                          child: GestureDetector(
                            onTap: () {
                              if (it.page != null) {
                                Navigator.push(
                                    context,
                                    MaterialPageRoute(
                                        builder: (_) => it.page!));
                              } else if (it.onTap != null) {
                                it.onTap!();
                              }
                            },
                            child: Column(
                              children: [
                                Container(
                                  width: 58,
                                  height: 58,
                                  decoration: BoxDecoration(
                                    color: JC.cream,
                                    borderRadius: BorderRadius.circular(18),
                                    border: Border.all(
                                        color: JC.creamDeep, width: 1.5),
                                  ),
                                  child: Icon(it.icon,
                                      color: JC.primary, size: 26),
                                ),
                                const SizedBox(height: 8),
                                Text(
                                  it.label,
                                  style: GoogleFonts.hindSiliguri(
                                      fontSize: 11.5,
                                      color: JC.ink,
                                      fontWeight: FontWeight.w500,
                                      height: 1.5),
                                  textAlign: TextAlign.center,
                                  maxLines: 1,
                                  overflow: TextOverflow.ellipsis,
                                ),
                              ],
                            ),
                          ),
                        ))
                    .toList(),
              );
            }

            void _showSpeedTest(BuildContext context) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: JC.white,
                shape: const RoundedRectangleBorder(
                  borderRadius:
                      BorderRadius.vertical(top: Radius.circular(24)),
                ),
                builder: (_) => const SpeedTestSheet(),
              );
            }

            void _showInvoiceSheet(BuildContext context) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: JC.white,
                shape: const RoundedRectangleBorder(
                  borderRadius:
                      BorderRadius.vertical(top: Radius.circular(24)),
                ),
                builder: (_) => DraggableScrollableSheet(
                  initialChildSize: 0.6,
                  minChildSize: 0.4,
                  maxChildSize: 0.9,
                  expand: false,
                  builder: (ctx, controller) => Column(
                    children: [
                      Container(
                        margin: const EdgeInsets.only(top: 10),
                        width: 40,
                        height: 4,
                        decoration: BoxDecoration(
                            color: JC.greyLight,
                            borderRadius: BorderRadius.circular(2)),
                      ),
                      Padding(
                        padding: const EdgeInsets.fromLTRB(20, 20, 20, 10),
                        child: Row(
                          children: [
                            Container(
                              width: 40,
                              height: 40,
                              decoration: BoxDecoration(
                                  color: JC.cream,
                                  borderRadius: BorderRadius.circular(12)),
                              child: const Icon(Icons.receipt_long_rounded,
