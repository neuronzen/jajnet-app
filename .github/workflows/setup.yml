name: Apply JAJ Net Design Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write lib/theme.dart
        run: |
          cat > lib/theme.dart << 'ENDTHEME'
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';

          class JC {
            static const Color primary = Color(0xFFFF6B00);
            static const Color primaryDark = Color(0xFFE55A00);
            static const Color primaryLight = Color(0xFFFF9F5A);
            static const Color primarySoft = Color(0xFFFFB88C);
            static const Color cream = Color(0xFFFFF6EE);
            static const Color creamDeep = Color(0xFFFFEBD8);
            static const Color peach = Color(0xFFFFD9B8);
            static const Color white = Color(0xFFFFFFFF);
            static const Color ink = Color(0xFF151A26);
            static const Color inkSoft = Color(0xFF2A3140);
            static const Color graphite = Color(0xFF4A5260);
            static const Color grey = Color(0xFF8A92A0);
            static const Color greyLight = Color(0xFFE8EAEE);
            static const Color greySoft = Color(0xFFF2F4F7);
            static const Color success = Color(0xFF00B87C);
            static const Color warning = Color(0xFFFFA000);
            static const Color error = Color(0xFFFF4757);
            static const Color info = Color(0xFF2E7DFF);

            static const LinearGradient heroGradient = LinearGradient(
              colors: [Color(0xFFFF9F5A), Color(0xFFFF6B00), Color(0xFFE55A00)],
              begin: Alignment.topLeft,
              end: Alignment.bottomRight,
            );

            static const LinearGradient sunGradient = LinearGradient(
              colors: [Color(0xFFFFB88C), Color(0xFFFF8A3D)],
              begin: Alignment.topLeft,
              end: Alignment.bottomRight,
            );

            static const LinearGradient darkGradient = LinearGradient(
              colors: [Color(0xFF232A3B), Color(0xFF151A26)],
              begin: Alignment.topLeft,
              end: Alignment.bottomRight,
            );

            static List<BoxShadow> softShadow = [
              BoxShadow(
                color: primary.withOpacity(0.15),
                blurRadius: 24,
                offset: const Offset(0, 10),
              ),
            ];

            static List<BoxShadow> cardShadow = [
              BoxShadow(
                color: ink.withOpacity(0.06),
                blurRadius: 16,
                offset: const Offset(0, 6),
              ),
            ];
          }

          class JajColors {
            static const Color primary = JC.primary;
            static const Color primaryDark = JC.primaryDark;
            static const Color accentLight = JC.creamDeep;
            static const Color background = JC.white;
            static const Color surfaceLight = JC.cream;
            static const Color textDark = JC.ink;
            static const Color textLight = JC.grey;
            static const Color success = JC.success;
            static const Color error = JC.error;
            static const Color warning = JC.warning;
          }

          ThemeData buildJajTheme() {
            final base = ThemeData(
              useMaterial3: true,
              scaffoldBackgroundColor: JC.white,
              colorScheme: ColorScheme.fromSeed(
                seedColor: JC.primary,
                brightness: Brightness.light,
                primary: JC.primary,
                surface: JC.white,
              ),
            );
            return base.copyWith(
              textTheme: GoogleFonts.hindSiliguriTextTheme(base.textTheme),
              appBarTheme: AppBarTheme(
                backgroundColor: JC.white,
                elevation: 0,
                scrolledUnderElevation: 0,
                centerTitle: false,
                foregroundColor: JC.ink,
                titleTextStyle: GoogleFonts.hindSiliguri(
                  color: JC.ink,
                  fontSize: 20,
                  fontWeight: FontWeight.w600,
                ),
              ),
              elevatedButtonTheme: ElevatedButtonThemeData(
                style: ElevatedButton.styleFrom(
                  backgroundColor: JC.primary,
                  foregroundColor: JC.white,
                  padding: const EdgeInsets.symmetric(vertical: 18, horizontal: 24),
                  shape: RoundedRectangleBorder(
                      borderRadius: BorderRadius.circular(18)),
                  elevation: 0,
                  textStyle: GoogleFonts.hindSiliguri(
                      fontSize: 16, fontWeight: FontWeight.w600),
                ),
              ),
              outlinedButtonTheme: OutlinedButtonThemeData(
                style: OutlinedButton.styleFrom(
                  foregroundColor: JC.primary,
                  side: const BorderSide(color: JC.primary, width: 1.5),
                  padding: const EdgeInsets.symmetric(vertical: 18, horizontal: 24),
                  shape: RoundedRectangleBorder(
                      borderRadius: BorderRadius.circular(18)),
                  textStyle: GoogleFonts.hindSiliguri(
                      fontSize: 16, fontWeight: FontWeight.w600),
                ),
              ),
              inputDecorationTheme: InputDecorationTheme(
                filled: true,
                fillColor: JC.cream,
                contentPadding:
                    const EdgeInsets.symmetric(horizontal: 18, vertical: 18),
                hintStyle: GoogleFonts.hindSiliguri(color: JC.grey, fontSize: 14),
                labelStyle: GoogleFonts.hindSiliguri(color: JC.grey, fontSize: 14),
                border: OutlineInputBorder(
                  borderRadius: BorderRadius.circular(16),
                  borderSide: BorderSide.none,
                ),
                enabledBorder: OutlineInputBorder(
                  borderRadius: BorderRadius.circular(16),
                  borderSide: BorderSide.none,
                ),
                focusedBorder: OutlineInputBorder(
                  borderRadius: BorderRadius.circular(16),
                  borderSide: const BorderSide(color: JC.primary, width: 2),
                ),
              ),
              cardTheme: CardTheme(
                color: JC.white,
                elevation: 0,
                shape:
                    RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
              ),
              navigationBarTheme: NavigationBarThemeData(
                backgroundColor: JC.white,
                indicatorColor: JC.creamDeep,
                elevation: 0,
                labelTextStyle: MaterialStateProperty.all(
                  GoogleFonts.hindSiliguri(
                      fontSize: 11, fontWeight: FontWeight.w500),
                ),
              ),
            );
          }
          ENDTHEME
          sed -i 's/^          //' lib/theme.dart

      - name: Write lib/splash.dart
        run: |
          cat > lib/splash.dart << 'ENDSPLASH'
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import 'login.dart';
          import 'onboarding.dart';
          import 'screens.dart';
          import 'services.dart';
          import 'theme.dart';

          class SplashScreenNew extends StatefulWidget {
            const SplashScreenNew({super.key});
            @override
            State<SplashScreenNew> createState() => _SplashScreenNewState();
          }

          class _SplashScreenNewState extends State<SplashScreenNew>
              with TickerProviderStateMixin {
            late final AnimationController _intro;
            late final AnimationController _pulse;
            late final AnimationController _wave;

            @override
            void initState() {
              super.initState();
              _intro = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 1800),
              )..forward();
              _pulse = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 1500),
              )..repeat(reverse: true);
              _wave = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 2600),
              )..repeat();
              _go();
            }

            Future<void> _go() async {
              await Future.delayed(const Duration(milliseconds: 3400));
              if (!mounted) return;
              final prefs = await SharedPreferences.getInstance();
              final seen = prefs.getBool('onboarding_seen') ?? false;
              final loggedIn = AuthService.currentUser != null;
              if (!mounted) return;
              final Widget next;
              if (loggedIn) {
                next = const MainShell();
              } else if (seen) {
                next = const LoginScreenNew();
              } else {
                next = const OnboardingScreen();
              }
              Navigator.pushReplacement(
                context,
                PageRouteBuilder(
                  transitionDuration: const Duration(milliseconds: 600),
                  pageBuilder: (_, __, ___) => next,
                  transitionsBuilder: (_, a, __, c) =>
                      FadeTransition(opacity: a, child: c),
                ),
              );
            }

            @override
            void dispose() {
              _intro.dispose();
              _pulse.dispose();
              _wave.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final size = MediaQuery.of(context).size;
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(gradient: JC.heroGradient),
                  child: Stack(
                    children: [
                      ..._waves(),
                      ..._particles(size),
                      SafeArea(
                        child: Column(
                          children: [
                            const Spacer(flex: 3),
                            _logo(),
                            const SizedBox(height: 40),
                            _name(),
                            const SizedBox(height: 14),
                            _tagline(),
                            const Spacer(flex: 4),
                            _loader(),
                            const SizedBox(height: 44),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            List<Widget> _waves() {
              return List.generate(4, (i) {
                return AnimatedBuilder(
                  animation: _wave,
                  builder: (_, __) {
                    final p = (_wave.value + i / 4) % 1.0;
                    final scale = 0.4 + p * 2.2;
                    final opacity = (1.0 - p) * 0.4;
                    return Center(
                      child: Transform.scale(
                        scale: scale,
                        child: Container(
                          width: 200,
                          height: 200,
                          decoration: BoxDecoration(
                            shape: BoxShape.circle,
                            border: Border.all(
                              color: Colors.white
                                  .withOpacity(opacity.clamp(0.0, 1.0)),
                              width: 1.4,
                            ),
                          ),
                        ),
                      ),
                    );
                  },
                );
              });
            }

            List<Widget> _particles(Size size) {
              final r = Random(11);
              return List.generate(30, (i) {
                final left = r.nextDouble() * size.width;
                final baseTop = r.nextDouble() * size.height;
                final sz = 2.0 + r.nextDouble() * 3.5;
                final delay = r.nextDouble();
                return AnimatedBuilder(
                  animation: _wave,
                  builder: (_, __) {
                    final t = (_wave.value + delay) % 1.0;
                    return Positioned(
                      left: left,
                      top: baseTop - t * 80,
                      child: Opacity(
                        opacity: (1 - t) * 0.55,
                        child: Container(
                          width: sz,
                          height: sz,
                          decoration: const BoxDecoration(
                            color: Colors.white,
                            shape: BoxShape.circle,
                          ),
                        ),
                      ),
                    );
                  },
                );
              });
            }

            Widget _logo() {
              return AnimatedBuilder(
                animation: _intro,
                builder: (_, __) {
                  final t =
                      Curves.easeOutBack.transform(_intro.value.clamp(0.0, 1.0));
                  return Transform.scale(
                    scale: 0.3 + t * 0.7,
                    child: AnimatedBuilder(
                      animation: _pulse,
                      builder: (_, __) {
                        final glow = 0.3 + _pulse.value * 0.4;
                        return Container(
                          width: 148,
                          height: 148,
                          decoration: BoxDecoration(
                            color: Colors.white,
                            borderRadius: BorderRadius.circular(46),
                            boxShadow: [
                              BoxShadow(
                                color: Colors.white.withOpacity(glow),
                                blurRadius: 44,
                                spreadRadius: 5,
                              ),
                              BoxShadow(
                                color: JC.primaryDark.withOpacity(0.5),
                                blurRadius: 28,
                                offset: const Offset(0, 14),
                              ),
                            ],
                          ),
                          child: const Icon(
                            Icons.wifi_rounded,
                            size: 78,
                            color: JC.primary,
                          ),
                        );
                      },
                    ),
                  );
                },
              );
            }

            Widget _name() {
              return AnimatedBuilder(
                animation: _intro,
                builder: (_, __) {
                  final t = (_intro.value * 1.5).clamp(0.0, 1.0);
                  return Opacity(
                    opacity: t,
                    child: Transform.translate(
                      offset: Offset(0, (1 - t) * 30),
                      child: Text(
                        'JAJ Net',
                        style: GoogleFonts.poppins(
                          fontSize: 44,
                          fontWeight: FontWeight.w800,
                          color: Colors.white,
                          letterSpacing: 1.8,
                        ),
                      ),
                    ),
                  );
                },
              );
            }

            Widget _tagline() {
              return AnimatedBuilder(
                animation: _intro,
                builder: (_, __) {
                  final t = ((_intro.value - 0.2) * 1.5).clamp(0.0, 1.0);
                  return Opacity(
                    opacity: t,
                    child: Transform.translate(
                      offset: Offset(0, (1 - t) * 20),
                      child: Text(
                        'তৈরি হোক নিরবিচ্ছিন্ন সম্পর্ক',
                        style: GoogleFonts.hindSiliguri(
                          fontSize: 17,
                          fontWeight: FontWeight.w500,
                          color: Colors.white.withOpacity(0.92),
                          letterSpacing: 0.5,
                        ),
                      ),
                    ),
                  );
                },
              );
            }

            Widget _loader() {
              return AnimatedBuilder(
                animation: _intro,
                builder: (_, __) {
                  final t = ((_intro.value - 0.4) * 1.5).clamp(0.0, 1.0);
                  return Opacity(
                    opacity: t,
                    child: Container(
                      width: 64,
                      height: 4,
                      decoration: BoxDecoration(
                        color: Colors.white.withOpacity(0.25),
                        borderRadius: BorderRadius.circular(3),
                      ),
                      child: AnimatedBuilder(
                        animation: _wave,
                        builder: (_, __) => Align(
                          alignment: Alignment(-1 + 2 * _wave.value, 0),
                          child: Container(
                            width: 24,
                            height: 4,
                            decoration: BoxDecoration(
                              color: Colors.white,
                              borderRadius: BorderRadius.circular(3),
                              boxShadow: [
                                BoxShadow(
                                  color: Colors.white.withOpacity(0.6),
                                  blurRadius: 8,
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    ),
                  );
                },
              );
            }
          }
          ENDSPLASH
          sed -i 's/^          //' lib/splash.dart

      - name: Write lib/main.dart
        run: |
          cat > lib/main.dart << 'ENDMAIN'
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';

          import 'splash.dart';
          import 'theme.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp();
            runApp(const JajNetApp());
          }

          class JajNetApp extends StatelessWidget {
            const JajNetApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'JAJ Net',
                debugShowCheckedModeBanner: false,
                theme: buildJajTheme(),
                home: const SplashScreenNew(),
              );
            }
          }
          ENDMAIN
          sed -i 's/^          //' lib/main.dart

      - name: Commit and push
        run: |
          git config user.name "JAJ Net Bot"
          git config user.email "bot@jajnet.local"
          git add .
          git commit -m "Premium redesign: animated splash + new theme" || echo "nothing to commit"
          git push
