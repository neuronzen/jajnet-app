          ENDLOGIN
          sed -i 's/^          //' lib/login.dart

      - name: Patch screens.dart logout
        run: |
          # Add login import if missing
          if ! grep -q "import 'login.dart';" lib/screens.dart; then
            sed -i "1i import 'login.dart';" lib/screens.dart
          fi
          # Replace LoginScreen() usages with LoginScreenNew()
          sed -i 's/const LoginScreen()/const LoginScreenNew()/g' lib/screens.dart
          echo "=== LoginScreen usages in screens.dart ==="
          grep -n "LoginScreen" lib/screens.dart || true

      - name: Commit and push
        run: |
          git config user.name "JAJ Net Bot"
          git config user.email "bot@jajnet.local"
          git add .
          git commit -m "Premium v2: new splash, creative login, fix logout nav" || echo "nothing to commit"
          git push
