name: Fix Color Alias

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add charcoal alias in theme.dart
        run: |
          grep -n "static const Color ink =" lib/theme.dart
          sed -i 's|static const Color ink = Color(0xFF151A26);|static const Color ink = Color(0xFF151A26);\n  static const Color charcoal = Color(0xFF151A26);|' lib/theme.dart
          grep -n "charcoal" lib/theme.dart

      - name: Commit and push
        run: |
          git config user.name "JAJ Net Bot"
          git config user.email "bot@jajnet.local"
          git add .
          git commit -m "Fix: add JC.charcoal alias for backward compat" || echo "nothing to commit"
          git push
