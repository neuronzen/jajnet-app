name: customer
description: JAJ Net ISP Customer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  firebase_messaging: ^14.7.10
  cloud_firestore: ^4.17.5
  google_fonts: ^6.1.0
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  http: ^1.1.2
  pdf: ^3.11.3
  share_plus: ^7.2.1
  image_gallery_saver_plus: ^4.0.1
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/jajnet-logo.png
    - assets/fonts/SolaimanLipi.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/jajnet-logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/jajnet-logo.png"
  min_sdk_android: 21
